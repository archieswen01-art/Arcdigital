  <style>
    :root { --c1:#fdba74; --c2:#f97316; --c3:#c2410c; --r:249,115,22; --sy:0; }
    html { scroll-padding-top: 88px; }
    body { background:#1a1410; }
    @keyframes float     { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    @keyframes breathe   { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    @keyframes spin      { to{transform:rotate(360deg)} }
    @keyframes dash      { to{stroke-dashoffset:-56} }
    @keyframes draw      { 0%{stroke-dashoffset:600} 55%,100%{stroke-dashoffset:0} }
    @keyframes bar       { from{transform:scaleY(.25)} to{transform:scaleY(1)} }
    @keyframes ping      { 0%{transform:scale(1);opacity:.8} 100%{transform:scale(2.3);opacity:0} }
    @keyframes steam     { 0%{opacity:0;transform:translateY(10px)} 50%{opacity:.85} 100%{opacity:0;transform:translateY(-16px)} }
    @keyframes blink     { 0%,40%{opacity:1} 50%,90%{opacity:.25} 100%{opacity:1} }
    @keyframes marquee   { to{transform:translateX(-50%)} }
    @keyframes shimmer   { to{background-position:200% 0} }
    @keyframes gradMove  { to{background-position:200% center} }
    @keyframes wordIn    { from{opacity:0;transform:translateY(70%) rotateX(-45deg);filter:blur(6px)} to{opacity:1;transform:none;filter:none} }
    @keyframes slideIn   { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:none} }
    @keyframes artIn     { from{opacity:0;transform:scale(.82) rotate(-5deg)} to{opacity:1;transform:none} }
    @keyframes aurora    { 0%,100%{transform:translate3d(0,0,0) scale(1)} 33%{transform:translate3d(6%,5%,0) scale(1.12)} 66%{transform:translate3d(-5%,6%,0) scale(.94)} }
    @keyframes dotFill   { from{transform:scaleX(0)} to{transform:scaleX(1)} }
    @keyframes tagPulse  { 0%{box-shadow:0 0 0 0 rgba(var(--r),.6)} 70%,100%{box-shadow:0 0 0 7px rgba(var(--r),0)} }
    @keyframes callPulse { 0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.5)} 50%{box-shadow:0 0 0 16px rgba(249,115,22,0)} }
    @keyframes pop       { from{opacity:0;transform:translateY(14px) scale(.97)} to{opacity:1;transform:none} }
    @keyframes barUp     { to{transform:scaleY(1)} }
    @keyframes lineDraw  { to{stroke-dashoffset:0} }
    @keyframes skel      { 0%{background-position:-200% 0} 100%{background-position:200% 0} }

    .text-gradient { background:linear-gradient(110deg,#fdba74,#f97316,#fbbf24,#fdba74); background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:gradMove 7s linear infinite; }
    .accent-g { background:linear-gradient(110deg,var(--c1),var(--c2),var(--c1)); background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:gradMove 6s linear infinite; }
    .mesh { background: radial-gradient(1200px 600px at 10% 0%,rgba(249,115,22,.22),transparent 60%), radial-gradient(900px 500px at 90% 10%,rgba(234,88,12,.20),transparent 60%), radial-gradient(800px 600px at 50% 100%,rgba(251,191,36,.14),transparent 60%); }
    .glass { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.10); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
    .grid-bg { background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px); background-size:56px 56px; -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%); mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%); }
    .shimmer-border { background:linear-gradient(90deg,#f97316,#fb923c,#fbbf24,#f97316); background-size:200% 100%; animation:shimmer 3s linear infinite; }
    .tnum { font-variant-numeric:tabular-nums; }
    .eyebrow { font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#fdba74; }
    .h2 { margin-top:.6rem; font-size:clamp(1.65rem,4.2vw,3rem); font-weight:800; letter-spacing:-.02em; line-height:1.12; }
    .lead { margin-top:1rem; color:#cbd5e1; font-size:1.05rem; line-height:1.65; }
    .par { transform:translate3d(0,calc(var(--sy) * -.12px),0); will-change:transform; }
    .aurora { border-radius:50%; filter:blur(80px); opacity:.35; animation:aurora 18s ease-in-out infinite; }
    @media (max-width:640px){ .aurora{ filter:blur(50px); } }
    .reveal { opacity:0; transform:translateY(28px); transition:opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1); }
    .reveal.is-visible { opacity:1; transform:none; }
    .pop { animation:pop .5s cubic-bezier(.2,.7,.2,1) both; }
    .tilt { transition:transform .25s ease-out, border-color .3s, box-shadow .3s; will-change:transform; }
    .spot { position:relative; overflow:hidden; }
    .spot::before { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0; transition:opacity .3s; background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(var(--r,249,115,22),.16),transparent 45%); }
    .spot:hover::before { opacity:1; }
    .hoverglow:hover { border-color:rgba(var(--r),.55); box-shadow:0 22px 50px -26px rgba(var(--r),.7); }
    .btn { position:relative; display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:1rem; padding:.85rem 1.4rem; font-weight:600; font-size:.95rem; line-height:1.2; overflow:hidden; transition:transform .25s ease, box-shadow .3s, background .3s, filter .3s; -webkit-tap-highlight-color:transparent; }
    .btn:active { transform:scale(.97); }
    .btn-sm { padding:.6rem 1rem; font-size:.85rem; border-radius:.85rem; }
    .btn-p { color:#fff; background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0)),var(--c3); box-shadow:0 12px 30px -12px rgba(var(--r),.8), inset 0 1px 0 rgba(255,255,255,.25); }
    .btn-p:hover { filter:brightness(1.1); box-shadow:0 16px 38px -10px rgba(var(--r),.95), inset 0 1px 0 rgba(255,255,255,.3); }
    .btn-g { color:#f1f5f9; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
    .btn-g:hover { background:rgba(255,255,255,.12); }
    .shine::after { content:""; position:absolute; top:0; left:-70%; width:40%; height:100%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent); transform:skewX(-20deg); transition:left .8s ease; pointer-events:none; }
    .shine:hover::after { left:140%; }
    .navbtn { display:grid; place-items:center; height:2.5rem; width:2.5rem; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); color:#fff; transition:.25s; }
    .navbtn:hover { background:var(--c3); border-color:var(--c3); transform:scale(1.06); }
    .nav-on { color:#fff !important; background:rgba(255,255,255,.08); }
    .soc { display:grid; place-items:center; height:2rem; width:2rem; border-radius:.5rem; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#cbd5e1; transition:.25s; }
    .soc:hover { background:var(--c3); border-color:var(--c3); color:#fff; transform:translateY(-2px); }
    .fchip { padding:.5rem 1rem; border-radius:999px; font-size:.85rem; font-weight:600; color:#cbd5e1; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); transition:.25s; }
    .fchip:hover { background:rgba(255,255,255,.1); }
    .fchip[aria-pressed="true"] { color:#fff; background:#c2410c; border-color:#fb923c; box-shadow:0 8px 24px -10px rgba(249,115,22,.8); }
    .chip { font-size:.7rem; font-weight:700; padding:.3rem .65rem; border-radius:.6rem; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#cbd5e1; }
    .tagpill { display:inline-flex; align-items:center; gap:.5rem; border-radius:999px; padding:.25rem .75rem; font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--c1); background:rgba(var(--r),.14); border:1px solid rgba(var(--r),.35); }
    .tagpill::before { content:""; height:6px; width:6px; border-radius:99px; background:var(--c1); animation:tagPulse 2s infinite; }
    .rot { overflow:hidden; line-height:1.18; padding-bottom:.12em; perspective:600px; }
    .word-in { display:inline-block; animation:wordIn .65s cubic-bezier(.2,.7,.2,1) both; }
    .sl { touch-action:pan-y; }
    .orb { position:absolute; border-radius:50%; filter:blur(70px); opacity:.28; background:var(--c2); transition:background-color 1s; pointer-events:none; }
    .track { display:flex; transition:transform .8s cubic-bezier(.2,.7,.2,1); will-change:transform; }
    .dragging .track { transition:none; }
    .dragging { cursor:grabbing; }
    .slide { flex:0 0 100%; min-width:0; }
    .slide.active .stagger > * { animation:slideIn .7s cubic-bezier(.2,.7,.2,1) both; }
    .slide.active .stagger > *:nth-child(2){ animation-delay:.07s } .slide.active .stagger > *:nth-child(3){ animation-delay:.14s }
    .slide.active .stagger > *:nth-child(4){ animation-delay:.21s } .slide.active .stagger > *:nth-child(5){ animation-delay:.28s }
    .slide.active .art { animation:artIn .9s cubic-bezier(.2,.7,.2,1) .1s both; }
    .dotw { padding:10px 3px; }
    .dot { display:block; position:relative; height:8px; width:8px; border-radius:999px; background:rgba(255,255,255,.18); overflow:hidden; transition:width .4s cubic-bezier(.2,.7,.2,1), background .3s; }
    .dotw:hover .dot { background:rgba(255,255,255,.35); }
    .dot.active { width:38px; }
    .dot i { position:absolute; inset:0; background:var(--c2); transform-origin:left; transform:scaleX(0); }
    .dot.active i { animation:dotFill var(--dur,8s) linear forwards; }
    .paused .dot.active i { animation-play-state:paused; }
    .noauto .dot.active i { animation:none; transform:none; }
    .f1{fill:var(--c1)} .f2{fill:var(--c2)} .f3{fill:var(--c3)} .fn{fill:none} .s1{stroke:var(--c1)} .s2{stroke:var(--c2)}
    .a-fl{animation:float 6s ease-in-out infinite} .a-fl2{animation:float 7s ease-in-out -2s infinite} .a-fl3{animation:float 5s ease-in-out -3.5s infinite}
    .a-spin{transform-origin:200px 200px;animation:spin 46s linear infinite} .a-spinr{transform-origin:200px 200px;animation:spin 60s linear infinite reverse}
    .a-dash{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
    .a-draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 3.8s ease-in-out infinite}
    .a-bar{transform-box:fill-box;transform-origin:bottom;animation:bar 2.4s ease-in-out infinite alternate}
    .a-ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
    .a-breathe{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
    .a-pulse{transform-box:fill-box;transform-origin:center;animation:breathe 2.6s ease-in-out infinite}
    .a-steam{animation:steam 3s ease-in-out infinite}
    .a-blink{animation:blink 4s ease-in-out infinite}
    .marq-mask { -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent); mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent); }
    .marq { display:flex; width:max-content; animation:marquee 48s linear infinite; }
    .marq:hover { animation-play-state:paused; }
    .marq > span { display:inline-flex; align-items:center; gap:.65rem; padding-right:2.5rem; white-space:nowrap; font-weight:600; color:#94a3b8; }
    .marq > span::before { content:""; height:6px; width:6px; border-radius:99px; background:#f97316; }
    .mbar { transform-origin:bottom; transform:scaleY(.04); }
    .is-visible .mbar { animation:barUp .9s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--i) * 70ms + .3s); }
    .mline { stroke-dasharray:400; stroke-dashoffset:400; }
    .is-visible .mline { animation:lineDraw 2s .4s ease forwards; }
    .skel { background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.14),rgba(255,255,255,.06)); background-size:200% 100%; animation:skel 2.2s linear infinite; border-radius:6px; }
    .floaty { animation:float 6s ease-in-out infinite; }
    #progress { position:fixed; top:0; left:0; height:3px; width:100%; transform-origin:left; transform:scaleX(0); background:linear-gradient(90deg,#fdba74,#f97316,#fbbf24); z-index:60; }
    #cursor { position:fixed; left:0; top:0; width:520px; height:520px; margin:-260px 0 0 -260px; border-radius:50%; pointer-events:none; z-index:1; background:radial-gradient(circle,rgba(249,115,22,.10),transparent 60%); opacity:0; transition:opacity .4s; mix-blend-mode:screen; }
    .menu { display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease; }
    .menu.open { grid-template-rows:1fr; }
    .fab { position:fixed; right:1rem; bottom:1rem; z-index:55; display:grid; place-items:center; height:3.5rem; width:3.5rem; border-radius:999px; background:#22c55e; color:#fff; box-shadow:0 12px 30px -8px rgba(34,197,94,.7); opacity:0; transform:translateY(16px) scale(.9); pointer-events:none; transition:.35s; }
    .fab.show { opacity:1; transform:none; pointer-events:auto; }
    .fab::after { content:""; position:absolute; inset:0; border-radius:inherit; border:2px solid #22c55e; animation:ping 2s ease-out infinite; }
    .toast { position:fixed; left:50%; bottom:5.5rem; z-index:70; transform:translate(-50%,20px); opacity:0; padding:.6rem 1rem; border-radius:999px; font-size:.85rem; font-weight:600; background:#fff; color:#1a1410; box-shadow:0 12px 30px rgba(0,0,0,.4); transition:.3s; pointer-events:none; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior:auto !important; }
      *, *::before, *::after { animation:none !important; transition:none !important; }
      .reveal { opacity:1 !important; transform:none !important; }
      .a-draw { stroke-dashoffset:0 !important; }
      .mbar { transform:none !important; }
      .mline { stroke-dashoffset:0 !important; }
      .dot.active i { transform:none !important; }
    }
  </style>
</head>

/* ═══════════════════════════════════════════════════════════════
   IndexedDB layer (same DB as admin.html)
   ═══════════════════════════════════════════════════════════════ */
const IDB_NAME = 'arcdigital_db';
const IDB_VERSION = 1;
const IDB_SETTINGS = 'settings';
const IDB_MEDIA = 'media';
const SETTINGS_KEY = 'portfolio';
const LEGACY_LS_KEY = 'arcdigital_admin_v1';

let _dbPromise = null;
function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_SETTINGS)) db.createObjectStore(IDB_SETTINGS, { keyPath: 'key' });
      if (!db.objectStoreNames.contains(IDB_MEDIA)) db.createObjectStore(IDB_MEDIA, { keyPath: 'key' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}
async function dbGet(store, key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result || null);
    req.onerror = () => rej(req.error);
  });
}
async function dbPut(store, val) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(val);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGetMedia(key) {
  if (!key) return null;
  try { const rec = await dbGet(IDB_MEDIA, key); return rec ? rec.dataUrl : null; } catch { return null; }
}
async function migrateLegacyIfNeeded() {
  try {
    const existing = await dbGet(IDB_SETTINGS, SETTINGS_KEY);
    if (existing) return;
    const raw = localStorage.getItem(LEGACY_LS_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    const mediaMap = parsed._media || {};
    delete parsed._media;
    for (const [k, v] of Object.entries(mediaMap)) {
      try { await dbPut(IDB_MEDIA, { key: k, dataUrl: v, updated: Date.now() }); } catch {}
    }
    await dbPut(IDB_SETTINGS, { key: SETTINGS_KEY, data: parsed, updated: Date.now() });
    localStorage.removeItem(LEGACY_LS_KEY);
  } catch (e) { console.warn('legacy migration skipped', e); }
}

/* Deep-merge default copy with whatever admin has saved */
function mergeCopy(saved) {
  const d = structuredClone(DEFAULT_COPY);
  if (!saved || typeof saved !== 'object') return d;
  const walk = (target, src) => {
    if (!src || typeof src !== 'object') return target;
    for (const k of Object.keys(src)) {
      const sv = src[k];
      if (Array.isArray(sv)) target[k] = sv;
      else if (sv && typeof sv === 'object') {
        if (!target[k] || typeof target[k] !== 'object' || Array.isArray(target[k])) target[k] = {};
        walk(target[k], sv);
      } else {
        target[k] = sv;
      }
    }
    return target;
  };
  return walk(d, saved);
}

const safeHref = url => {
  if (!url) return '#';
  const t = String(url).trim().toLowerCase();
  if (t.startsWith('javascript:') || t.startsWith('data:text/html') || t.startsWith('vbscript:')) return '#';
  return url;
};

/* Small escape for text nodes */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

/* Guard: coerce a value into an array. Handles strings (comma-separated),
   nulls, and anything else gracefully so .map() never throws. */
const asArray = v => {
  if (Array.isArray(v)) return v;
  if (typeof v === 'string') return v.split(',').map(s => s.trim()).filter(Boolean);
  return [];
};

/* Normalize team links into [[icon, href, label], …] regardless of input shape.
   This is the fix for "(t.links || []).map is not a function": team.links can be
   a string (from DEFAULTS.team or the admin textarea) or an array of tuples. */
function normalizeTeamLinks(links) {
  if (Array.isArray(links)) {
    return links
      .filter(Array.isArray)
      .map(a => a.map(x => String(x == null ? '' : x).trim()))
      .filter(a => a.length >= 2);
  }
  if (typeof links === 'string') {
    return links
      .split('\n')
      .map(line => line.split('|').map(s => s.trim()))
      .filter(a => a.length >= 2);
  }
  return [];
}

/* Sanitizer for copy fields that allow limited HTML */
const ALLOWED_TAGS = new Set(['STRONG','EM','BR','SPAN']);
const ALLOWED_SPAN_CLASSES = new Set(['text-white','text-gradient','accent-g']);
function sanitizeCopyHtml(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  const walk = node => {
    if (node.nodeType === 1) {
      if (!ALLOWED_TAGS.has(node.tagName)) {
        const text = document.createTextNode(node.textContent || '');
        node.replaceWith(text);
        return;
      }
      if (node.tagName === 'SPAN') {
        const cls = (node.getAttribute('class') || '').split(/\s+/).filter(c => ALLOWED_SPAN_CLASSES.has(c));
        if (cls.length) node.setAttribute('class', cls.join(' '));
        else node.removeAttribute('class');
      }
      for (const attr of Array.from(node.attributes)) {
        if (attr.name !== 'class') node.removeAttribute(attr.name);
      }
      Array.from(node.childNodes).forEach(walk);
    }
  };
  Array.from(tpl.content.childNodes).forEach(walk);
  return tpl.innerHTML;
}

function setCopyText(el, val) { if (el) el.textContent = String(val == null ? '' : val); }
function setCopyHtml(el, val) { if (el) el.innerHTML = sanitizeCopyHtml(val); }

function slideHTML(p, i) {
  const c = COPY.catalog;
  const viewBtn = p.link
    ? `<a href="${esc(safeHref(p.link))}" target="_blank" rel="noopener noreferrer" class="btn btn-p shine" data-magnetic>${esc(c.viewBtn)} ${ic('ext')}</a>`
    : `<span class="btn btn-g" style="opacity:.45;cursor:not-allowed;pointer-events:none">${esc(c.comingSoonBtn)}</span>`;
  return `
  <article class="slide" data-i="${i}" style="${vars(p)}" role="group" aria-roledescription="slide" aria-label="${i+1} / ${PROJECTS.length}: ${esc(p.name)}${esc(p.accent)} ${esc(p.sub)}">
    <div class="grid lg:grid-cols-2 gap-8 lg:gap-12 items-center p-6 sm:p-10 lg:p-14">
      <div class="stagger order-2 lg:order-1 text-center lg:text-left">
        <span class="tagpill">${esc(p.tag)}</span>
        <h3 class="mt-4 text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight leading-[1.08]">${esc(p.name)}<span class="accent-g">${esc(p.accent)}</span><br><span class="text-white/90">${esc(p.sub)}</span></h3>
        <p class="mt-4 text-sm sm:text-base lg:text-lg text-slate-300 max-w-xl mx-auto lg:mx-0 leading-relaxed">${esc(p.desc)}</p>
        <div class="flex flex-wrap gap-2 justify-center lg:justify-start" style="margin-top:1.25rem">${asArray(p.chips).map(ch=>`<span class="chip">${esc(ch)}</span>`).join('')}</div>
        <div class="flex flex-col sm:flex-row gap-3 justify-center lg:justify-start" style="margin-top:1.75rem">
          ${viewBtn}
          <a data-phone1-link href="tel:0761980718" class="btn btn-g">${ic('phone')} ${esc(COPY.hero.ctaPhoneLabel)}</a>
        </div>
      </div>
      <div class="art order-1 lg:order-2 flex items-center justify-center">
        <div class="relative w-full max-w-[20rem] sm:max-w-md aspect-square">
          <div class="absolute inset-6 rounded-full blur-3xl opacity-25" style="background:var(--c2)"></div>
          ${ART[p.icon] ? ART[p.icon]() : ART.idea()}

  </article>`;
}

function cardHTML(p, i) {
  const c = COPY.catalog;
  const viewBtn = p.link
    ? `<a href="${esc(safeHref(p.link))}" target="_blank" rel="noopener noreferrer" class="btn btn-p btn-sm shine flex-1">${esc(c.viewBtn)} ${ic('ext')}</a>`
    : `<span class="btn btn-g btn-sm flex-1" style="opacity:.45;cursor:not-allowed;pointer-events:none">${esc(c.comingSoonBtn)}</span>`;
  return `
  <div class="reveal" data-cat="${esc(p.cat)}" style="transition-delay:${(i%3)*80}ms">
    <article class="tilt spot hoverglow glass h-full flex flex-col rounded-3xl p-6" data-tilt style="${vars(p)}">
      <div class="flex items-start justify-between gap-3">
        <span class="grid h-12 w-12 place-items-center rounded-2xl" style="color:var(--c1);background:rgba(var(--r),.15);box-shadow:inset 0 0 0 1px rgba(var(--r),.3)">${gl(p.icon,'h-6 w-6')}</span>
        <span class="tagpill">${esc(p.cat)}</span>
      </div>
      <h3 class="mt-5 text-xl font-extrabold tracking-tight">${esc(p.name)}<span class="accent-g">${esc(p.accent)}</span></h3>
      <p class="mt-0.5 text-xs font-semibold uppercase tracking-wider text-slate-400">${esc(p.sub)}</p>
      <p class="mt-3 flex-1 text-sm leading-relaxed text-slate-300">${esc(p.desc)}</p>
      <div class="mt-4 flex flex-wrap gap-1.5">${asArray(p.chips).slice(0,3).map(ch=>`<span class="chip">${esc(ch)}</span>`).join('')}</div>
      <div class="mt-5 flex gap-2">
        ${viewBtn}
        <button type="button" data-goto="${i}" class="btn btn-g btn-sm" aria-label="${esc(c.previewAriaPrefix)}${esc(p.name)}${esc(p.accent)}">${esc(c.previewBtn)}</button>
      </div>
    </article>
  </div>`;
}

function buildCatalog() {
  $('#catalogGrid').innerHTML = PROJECTS.map(cardHTML).join('');
  const cats = [COPY.catalog.filterAllLabel, ...new Set(PROJECTS.map(p => p.cat).filter(Boolean))];
  $('#filters').innerHTML = cats.map((c,i)=>`<button type="button" class="fchip" data-filter="${esc(c)}" aria-pressed="${i===0}">${esc(c)}</button>`).join('');
  const fEl = $('#filters');
  if (!fEl.dataset.bound) {
    fEl.dataset.bound = '1';
    fEl.addEventListener('click', e => {
      const b = e.target.closest('[data-filter]'); if (!b) return;
      $$('.fchip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      $$('#catalogGrid > [data-cat]').forEach(card => {
        const show = b.dataset.filter === COPY.catalog.filterAllLabel || card.dataset.cat === b.dataset.filter;
        card.style.display = show ? '' : 'none';
        if (show) { card.classList.add('is-visible'); card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop'); }
      });
    });
  }
}

  }).join('');
}

  /* Defensive: t.links might still be a string if normalization was bypassed */
  const linksArr = Array.isArray(t.links) ? t.links
    : typeof t.links === 'string'
      ? t.links.split('\n').map(l => l.split('|').map(s => s.trim())).filter(a => a.length >= 2)

  const linksHTML = linksArr.map(([i,h,l]) => {
    const safe = safeHref(h);

  <div class="reveal">

        ${photoHTML}
        <div class="absolute inset-0 bg-gradient-to-t from-ink-900 via-ink-900/40 to-transparent pointer-events-none"></div>

      </div>
      <div class="relative -mt-12 p-5 sm:p-6">
        <h3 class="text-lg sm:text-xl font-extrabold text-white">${esc(t.name)}</h3>
        <p class="mt-0.5 text-xs sm:text-sm font-semibold" style="color:var(--c1)">${esc(t.title)}</p>
        <p class="mt-3 text-xs sm:text-sm leading-relaxed text-slate-400">${esc(t.bio)}</p>
        <div class="mt-4 flex items-center gap-2">${linksHTML}</div>
      </div>
    </article>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════
   SLIDER
   ═══════════════════════════════════════════════════════════════ */
let cur = 0, timer = null, hovering = false, inView = true, dragging = false, sliderBound = false;
function buildSlider() {
  $('#track').innerHTML = PROJECTS.map(slideHTML).join('');
  $('#dots').innerHTML = PROJECTS.map((p, i) =>
    `<button type="button" class="dotw" data-dot="${i}" aria-label="Show ${esc(p.name)}${esc(p.accent)}"><span class="dot"><i></i></span></button>`
  ).join('');
  initSlider();
}

function initSlider() {
  const stage = $('#showcase'), box = $('#slider'), track = $('#track'), ctrl = $('#ctrl'), dotsEl = $('#dots');
  if (!stage || !box || !track) return;
  const slides = $$('.slide', track);
  if (!slides.length) return;
  const DUR = 8000, auto = !reduce;
  dotsEl.style.setProperty('--dur', DUR + 'ms');
  if (!auto) stage.classList.add('noauto');

  function restartFill() {
    const f = dotsEl.children[cur] && dotsEl.children[cur].querySelector('i');
    if (!f) return; f.style.animation = 'none'; void f.offsetWidth; f.style.animation = '';
  }
  function state() {
    clearTimeout(timer);
    const run = auto && !hovering && inView && !document.hidden && !dragging;
    stage.classList.toggle('paused', !run);
    if (run) { restartFill(); timer = setTimeout(() => go(cur + 1), DUR); }
  }
  function paint() {
    track.style.transform = `translateX(-${cur * 100}%)`;
    slides.forEach((s, i) => { const on = i === cur; s.classList.toggle('active', on); s.setAttribute('aria-hidden', String(!on)); if (on) s.removeAttribute('inert'); else s.setAttribute('inert', ''); });
    const p = PROJECTS[cur]; if (!p) return;
    box.style.setProperty('--c2', p.c2); box.style.setProperty('--r', rgb(p.c2));
    ctrl.style.setProperty('--c2', p.c2); ctrl.style.setProperty('--c3', p.c3);
    Array.from(dotsEl.children).forEach((d, i) => d.firstChild.classList.toggle('active', i === cur));
    $('#slideCounter').textContent = `${cur + 1} / ${slides.length}`;
    $('#slideName').textContent = `${p.name}${p.accent} — ${p.sub}`;
    state();
  }
  function go(i) { cur = (i + slides.length) % slides.length; paint(); }
  window.__sliderGo = go;

  const prev = $('#prevBtn'), next = $('#nextBtn');
  const prevClone = prev.cloneNode(true), nextClone = next.cloneNode(true);
  prev.replaceWith(prevClone); next.replaceWith(nextClone);
  prevClone.addEventListener('click', () => go(cur - 1));
  nextClone.addEventListener('click', () => go(cur + 1));
  prevClone.setAttribute('aria-label', COPY.hero.prevAria);
  nextClone.setAttribute('aria-label', COPY.hero.nextAria);

  dotsEl.querySelectorAll('[data-dot]').forEach(d => {
    d.onclick = () => go(+d.dataset.dot);
  });

  if (!sliderBound) {
    sliderBound = true;
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-goto]'); if (!b) return;
      if (window.__sliderGo) window.__sliderGo(+b.dataset.goto);
      const rect = stage.getBoundingClientRect();
      const near = rect.top < window.innerHeight && rect.bottom > 0;
      if (!near) stage.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    });
    document.addEventListener('keydown', e => {
      if (!inView || /input|textarea|select/i.test(e.target.tagName)) return;
      if (e.key === 'ArrowLeft') go(cur - 1); else if (e.key === 'ArrowRight') go(cur + 1);
    });
    box.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { hovering = true; state(); } });
    box.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { hovering = false; state(); } });

    let startX = 0, dx = 0, bw = 0;
    box.addEventListener('pointerdown', e => {
      if (e.button > 0 || e.target.closest('a,button')) return;
      dragging = true; startX = e.clientX; dx = 0; bw = box.offsetWidth;
      box.classList.add('dragging'); box.setPointerCapture(e.pointerId); state();
    });
    box.addEventListener('pointermove', e => {
      if (!dragging) return;
      dx = e.clientX - startX;
      track.style.transform = `translateX(${-cur * bw + dx}px)`;
    });
    const endDrag = () => {
      if (!dragging) return;
      dragging = false; box.classList.remove('dragging');
      const t = bw * .15;
      if (dx > t) go(cur - 1); else if (dx < -t) go(cur + 1); else paint();
      dx = 0;
    };
    box.addEventListener('pointerup', endDrag);
    box.addEventListener('pointercancel', endDrag);

    new IntersectionObserver(es => { inView = es[0].isIntersecting; state(); }, { threshold: .25 }).observe(box);
    document.addEventListener('visibilitychange', state);
  }
  if (cur >= slides.length) cur = 0;
  paint();
}

/* ═══════════════════════════════════════════════════════════════
   EFFECTS
   ═══════════════════════════════════════════════════════════════ */
function bindEffects() {
  const rotEl = $('#rotWord');
  if (rotEl) {
    const list = String(COPY.hero.rotWords || '').split(',').map(s => s.trim()).filter(Boolean);
    const words = list.length ? list : ['schools'];
    if (reduce) rotEl.textContent = words[0];
    else {
      clearInterval(window.__rotInt);
      let wi = 0;
      rotEl.textContent = words[0];
      window.__rotInt = setInterval(() => {
        wi = (wi + 1) % words.length;
        rotEl.textContent = words[wi];
        rotEl.classList.remove('word-in'); void rotEl.offsetWidth; rotEl.classList.add('word-in');
      }, 2300);
    }
  }

  const rio = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); rio.unobserve(e.target); } }), { threshold: .12, rootMargin: '0px 0px -40px 0px' });
  $$('.reveal').forEach(el => { if (!el.classList.contains('is-visible')) rio.observe(el); });

  const cio = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return; cio.unobserve(e.target);
    const el = e.target, end = +el.dataset.count, suf = el.dataset.suffix || '';
    if (!end || reduce) { el.textContent = (end || 0).toLocaleString() + suf; return; }
    const t0 = performance.now(), d = 1400;
    (function f(t){ const p = Math.min(1, (t - t0) / d); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))).toLocaleString() + suf; if (p < 1) requestAnimationFrame(f); })(t0);
  }), { threshold: .6 });
  $$('[data-count]').forEach(el => cio.observe(el));

  $$('[data-tilt]').forEach(el => {
    if (el.dataset.fx) return; el.dataset.fx = '1';
    el.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse') return;
      const r = el.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      el.style.setProperty('--mx', x + 'px'); el.style.setProperty('--my', y + 'px');
      if (!reduce) el.style.transform = `perspective(900px) rotateX(${((y / r.height) - .5) * -6}deg) rotateY(${((x / r.width) - .5) * 8}deg) translateY(-3px)`;
    });
    el.addEventListener('pointerleave', () => { el.style.transform = ''; });
  });
  if (fine && !reduce) {
    $$('[data-magnetic]').forEach(el => {
      if (el.dataset.mg) return; el.dataset.mg = '1';
      el.addEventListener('pointermove', e => { const r = el.getBoundingClientRect(); el.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * .15}px,${(e.clientY - r.top - r.height / 2) * .25}px)`; });
      el.addEventListener('pointerleave', () => { el.style.transform = ''; });
    });
  }

  if (!window.__scrollBound) {
    window.__scrollBound = true;
    const progress = $('#progress'), navbar = $('#navbar'), fab = $('#fab'), root = document.documentElement;
    let ticking = false;
    const onScroll = () => {
      if (ticking) return; ticking = true;
      requestAnimationFrame(() => {
        const y = scrollY, h = root.scrollHeight - innerHeight;
        progress.style.transform = `scaleX(${h > 0 ? y / h : 0})`;
        if (!reduce) root.style.setProperty('--sy', Math.round(y));
        navbar.classList.toggle('bg-ink-900/70', y > 20); navbar.classList.toggle('shadow-xl', y > 20);
        fab.classList.toggle('show', y > 600);
        ticking = false;
      });
    };
    addEventListener('scroll', onScroll, { passive: true }); onScroll();

    const navLinks = $$('[data-nav]');
    const nio = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      navLinks.forEach(a => a.classList.toggle('nav-on', a.getAttribute('href') === '#' + e.target.id));
    }), { rootMargin: '-40% 0px -55% 0px' });
    ['catalog','demo','services','about','team','process','contact'].forEach(id => { const s = document.getElementById(id); if (s) nio.observe(s); });

    const menuBtn = $('#menuBtn');
    if (menuBtn) menuBtn.addEventListener('click', () => setMenu(!menuOpen));

    if (fine && !reduce) {
      const cur2 = $('#cursor'); let tx = 0, ty = 0, x = 0, y = 0, raf = 0;
      const loop = () => { x += (tx - x) * .15; y += (ty - y) * .15; cur2.style.transform = `translate3d(${x}px,${y}px,0)`; raf = (Math.abs(tx - x) + Math.abs(ty - y) > .5) ? requestAnimationFrame(loop) : 0; };
      addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; cur2.style.opacity = 1; if (!raf) raf = requestAnimationFrame(loop); }, { passive: true });
    }

    if (reduce) $$('svg').forEach(s => s.pauseAnimations && s.pauseAnimations());
  }
}

function bindCopyButtons() {
  const toastEl = $('#toast'); let toastT;
  const showToast = msg => { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2200); };
  const btn = document.querySelector('[data-copy-btn]');
  if (!btn) return;
  btn.addEventListener('click', () => {
    const url = SITE.demoUrl || DEFAULTS.site.demoUrl;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url)
        .then(() => showToast(COPY.demo.copiedToast))
        .catch(() => showToast(COPY.demo.copyFailToast));
    } else {
      showToast(COPY.demo.copyFailToast);
    }
  });
}

/* Go */
boot().catch(err => { console.error(err); });
